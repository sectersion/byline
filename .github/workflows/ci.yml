# CHORE-001: test CI on PRs only. Merge runs would double-run what the PR
# already proved. Pushes to main are skipped for the same reason.
name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -- --test-threads=1
        env:
          BYLINE_TZ_OFFSET: "0"
